# xcodegen spec. Generate the project with `xcodegen` in this directory.
name: CarNetProbe
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  CarNetProbe:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: CarNet Probe
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: Finds the head unit and the garage box on the CarPlay Wi-Fi.
        NSBonjourServices: [_carplay-ctrl._tcp, _airplay._tcp, _raop._tcp]
        NSLocationWhenInUseUsageDescription: iOS only shows the Wi-Fi network name and signal to apps with location access.
        NSLocationAlwaysAndWhenInUseUsageDescription: Drive mode logs where the garage internet ends and cellular starts, and keeps logging with the phone locked.
        UIBackgroundModes: [location]
    # SSID/BSSID/signal need Access Wi-Fi Information, which needs an explicit
    # App ID (the team's wildcard profile can't carry it). To turn it on:
    #   entitlements:
    #     path: Sources/CarNetProbe.entitlements
    #     properties:
    #       com.apple.developer.networking.wifi-info: true
    # Without it the app works and just shows "none" for the Wi-Fi name.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.carplaywan.probe
        DEVELOPMENT_TEAM: 6U62M4232W
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
