; imuprobe: a read-only QMI8658 diagnostic for the T-Beam S3 Supreme.
;
; Separate from the CarNet Beam firmware so the two cannot interfere. It writes
; nothing to the sensor -- every test is a register read -- because a write to a
; part that is not responding only adds a variable.
[env:tbeam-s3-supreme]
platform = espressif32@6.13.0
framework = arduino
board = t-beams3-supreme
board_build.partitions = default.csv
upload_speed = 460800
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    lewisxhe/XPowersLib@^0.2.6
