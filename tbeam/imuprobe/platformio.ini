; imuprobe: a QMI8658 diagnostic for the T-Beam S3 Supreme.
;
; Separate from the CarNet Beam firmware so the two cannot interfere. Phases A
; and the register dump are read-only; phase D writes, because every failure we
; have is a read failure and reads are exhausted. Every register it writes is
; volatile and undone by a power cycle.


[env:tbeam-s3-supreme]
platform = espressif32@6.13.0
framework = arduino
board = t-beams3-supreme
board_build.partitions = default.csv
upload_speed = 460800
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    lewisxhe/XPowersLib@^0.2.6
