; CarNet Beam: drive-test companion for the CarPlay departure investigation.
;
; Builds on the build host, never on the Mac (owner policy). Flashing with
; esptool from the Mac is fine -- that is not a build.
[env:tbeam-s3-supreme]
platform = espressif32@6.13.0
framework = arduino
board = t-beams3-supreme          ; the repo-local boards/*.json, not a stock one
board_build.partitions = default.csv
upload_speed = 460800
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1          ; the console is USB-CDC, not UART0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    lewisxhe/XPowersLib@^0.2.6    ; AXP2101: almost every rail is off at reset
    lewisxhe/SensorLib@^0.3.1     ; QMI8658 over SPI -- the driver LilyGO's own example uses
    olikraus/U8g2@^2.35.30        ; SH1106 OLED
