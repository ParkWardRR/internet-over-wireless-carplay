# Trial A — baseline: Interworking present, Internet bit clear.
#
# This is what the F32's NBT EVO transmits (docs/test-log.md, 2026-11-02:
# "802.11u Interworking: Internet bit 0, Private, venue group Vehicular"), so a
# phone that behaves differently here than on the car has told us the beacon is
# not the whole story.
#
# access_network_type=0 is "private network", the car's value. The internet
# flag is a statement about the connection, not an instruction to the client:
# nothing in 802.11u lets an AP tell a station which path to route over.

interworking=1
access_network_type=0
internet=0
